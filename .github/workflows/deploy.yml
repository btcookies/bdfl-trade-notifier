name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

# Never run two deploys against the stack at once; do not cancel one mid-changeset either.
concurrency:
  group: deploy-bdfl-notifier
  cancel-in-progress: false

jobs:
  deploy:
    # Opt in by setting the repository variable (Settings > Secrets and variables > Actions > Variables).
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    # arm64 runner so sam build resolves wheels for the function's architecture natively.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            src/requirements.txt
            hof/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests scripts hof
      - run: pytest
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true
          version: 1.166.0
      # Build before assuming the role so no third-party build code runs with AWS credentials.
      - run: sam build
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
