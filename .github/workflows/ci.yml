name: CI

on:
  pull_request:
  push:
    branches: [main, discord-port]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            src/requirements.txt
            hof/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests scripts hof
      - run: pytest
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true
          version: 1.166.0
      - run: sam validate --lint
      - run: sam validate --lint --template infra/github-oidc.yaml
      - run: sam build
